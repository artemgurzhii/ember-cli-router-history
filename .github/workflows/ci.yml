name: CI

on:
  push:
    branches:
      - master
      - main
  pull_request: {}

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 'Tests'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter ember-cli-router-history build
      - name: Re-sync workspace so the injected addon picks up dist/
        run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm --filter test-app test:ember

  try-scenarios:
    name: 'Try: ${{ matrix.try-scenario }}'
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 10
    continue-on-error: ${{ matrix.allow-failure || false }}
    strategy:
      fail-fast: false
      matrix:
        try-scenario:
          - ember-lts-4.12
          - ember-lts-5.4
          - ember-lts-5.8
          - ember-lts-5.12
          - ember-lts-6.4
          - ember-lts-6.8
          - ember-lts-6.12
          - embroider-safe
          - embroider-optimized
        # include:
        #   # Forward-looking scenarios — ember-source 6.x needs ember-cli 6.x.
        #   # Our test-app stays on ember-cli 5.12 (LTS), so these can break
        #   # for reasons unrelated to the addon. Reported but not gating.
        #   - try-scenario: ember-release
        #     allow-failure: true
        #   - try-scenario: ember-beta
        #     allow-failure: true
        #   - try-scenario: ember-canary
        #     allow-failure: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter ember-cli-router-history build
      - name: Re-sync workspace so the injected addon picks up dist/
        run: pnpm install --frozen-lockfile
      - name: Run try scenario
        run: pnpm --filter test-app exec ember try:one ${{ matrix.try-scenario }} --skip-cleanup
