name: CI

on:
  push:
    branches:
      - master
      - main
  pull_request: {}

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  setup:
    name: 'Setup'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: set-matrix
        run: echo "matrix=$(pnpm -s dlx @embroider/try list)" >> $GITHUB_OUTPUT
        working-directory: test-app

  test:
    name: 'Tests'
    needs: [setup]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter ember-cli-router-history build
      - name: Re-sync workspace so the injected addon picks up dist/
        run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm --filter test-app test:ember

  floating:
    name: 'Floating Dependencies'
    needs: [test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-lockfile
      - run: pnpm --filter ember-cli-router-history build
      - run: pnpm install --no-lockfile
      - run: pnpm --filter test-app test:ember

  compatibility:
    name: '${{ matrix.name }}'
    needs: [setup, test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter ember-cli-router-history build
      - name: Apply scenario ${{ matrix.name }}
        run: pnpm dlx @embroider/try apply ${{ matrix.name }}
        working-directory: test-app
      - name: Install dependencies for scenario
        run: pnpm install --no-lockfile
      - name: Run tests
        run: pnpm test:ember
        env: ${{ matrix.env }}
        working-directory: test-app
